# The lifted program. `pdp1cc build` compiles the files in this order into
# one Macro program, assembles it with macro1 and compares the .rim sha256
# with the oracle. The order is the order of the words on the tape.
macro1 = "build/macro1"
macro1_src = "tools/macro1.c"
oracle_sha256 = "8744e9c9c8540cc5075c5cbb91c56745a4305fdf8e7afca43bea2e9e04ca4bdf"
oracle_listing = "build/oracle.lst"

