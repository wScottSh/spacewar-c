[project]
name = "pdp1cc"
version = "0.1.0"
description = "C dialect to PDP-1 Macro compiler for the Spacewar 3.1 lift"
requires-python = ">=3.12"
dependencies = [
    "pycparser==3.11",
    "pycparserext==2026.1",
]

[project.scripts]
pdp1cc = "pdp1cc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/pdp1cc"]
